[env]
TERM = "xterm-256color"
WINIT_X11_SCALE_FACTOR = "1"

[window]
decorations = "Full"
title = "DJNCava"
dynamic_title = false
opacity = 0
decorations_theme_variant = "Dark"
startup_mode = "Maximized"

[window.dimensions]
columns = 0
lines = 0

[window.class]
instance = "AlacrittyDJNCava"
general = "AlacrittyDJNCava"

[scrolling]
history = 10000
multiplier = 3

[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
background = "#0b0015"
foreground = "#e3e3e3"

[colors.normal]
black = "#141414"
red = "#ed1515"
green = "#27d132"
yellow = "#ffcb0e"
blue = "0x2175f3"
magenta = "0x9737e1"
cyan = "0x09dacc"
white = "0xdfdfdf"

[colors.bright]
black = "#7f8c8d"
red = "#ff0000"
green = "#04dc00"
yellow = "#ffff00"
blue = "#0066ff"
magenta = "#b700ff"
cyan = "#00ffff"
white = "#ffffff"

[font]
size = 4

[font.normal]
family = "NotoSansM Nerd Font Mono"
style = "Medium"

[font.bold]
style = "Bold"

[font.italic]
style = "SemCond"

[font.bold_italic]
style = "Cond ExtBd"

[font.offset]
x = 0
y = 0

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"
save_to_clipboard = true

[cursor]
style = "Underline"
vi_mode_style = "None"
unfocused_hollow = true
thickness = 0.15

[mouse]
hide_when_typing = true

[[mouse.bindings]]
mouse = "Middle"
action = "PasteSelection"

[keyboard]
[[keyboard.bindings]]
key = "Paste"
action = "Paste"

[[keyboard.bindings]]
key = "Copy"
action = "Copy"

[[keyboard.bindings]]
key = "L"
mods = "Control"
action = "ClearLogNotice"

[[keyboard.bindings]]
key = "L"
mods = "Control"
mode = "~Vi"
chars = "\f"

[[keyboard.bindings]]
key = "PageUp"
mods = "Shift"
mode = "~Alt"
action = "ScrollPageUp"

[[keyboard.bindings]]
key = "PageDown"
mods = "Shift"
mode = "~Alt"
action = "ScrollPageDown"

[[keyboard.bindings]]
key = "Home"
mods = "Shift"
mode = "~Alt"
action = "ScrollToTop"

[[keyboard.bindings]]
key = "End"
mods = "Shift"
mode = "~Alt"
action = "ScrollToBottom"

[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "F"
mods = "Control|Shift"
action = "SearchForward"

[[keyboard.bindings]]
key = "B"
mods = "Control|Shift"
action = "SearchBackward"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
mode = "Vi"
action = "ClearSelection"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"

[general]
live_config_reload = true
working_directory = "None"
